spring.application.name=prompt-template-registry
server.port=8080

# In-memory H2 - zero external setup required to run or demo.
spring.datasource.url=jdbc:h2:mem:ptr;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console available at http://localhost:8080/h2-console (jdbc url: jdbc:h2:mem:ptr)
spring.h2.console.enabled=true
